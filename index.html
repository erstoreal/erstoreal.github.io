<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERSTORE</title>
    <style>
        /* Pengaturan Dasar & Tema Abu-abu Gelap */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #181b20;
            color: #f3f4f6;
            min-height: 200vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header Sticky Ramping */
        .navbar {
            background: #21262d;
            border-bottom: 1px solid #30363d;
            padding: 6px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Tombol Ikon */
        .icon-btn {
            background: transparent;
            border: none;
            color: #f3f4f6;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .icon-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }
                /* Styling Banner Slider Polos */
        .banner-section {
            padding: 16px 0;
        }

        .slider-container {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            background: #1e293b;
        }

        .slider-track {
            display: flex;
            transition: transform 0.4s ease-in-out;
            width: 100%;
        }

        .slide {
            min-width: 100%;
            aspect-ratio: 16 / 9; /* Membuat bentuk banner melebar ala game */
            background-size: cover;
            background-position: center;
        }

                 /* Banner KOF x MLBB Aesthetic (Serasi dengan Tema Api) */
        .slide-1 {
            background-image: url('slide-kof-1.jpg'); /* Ganti dengan nama file upload min */
        }

        .slide-2 {
            background-image: url('slide-kof-2.jpg');
        }

        .slide-3 {
            background-image: url('slide-kof-3.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Menyesuaikan warna titik indikator agar serasi dengan api KOF */
        .dot.active {
            background: #ff4500; /* Warna oranye kemerahan menyala (senada api KOF) */
            width: 20px;
            border-radius: 6px;
        }

        /* Menyesuaikan kecepatan transisi slider agar mulus */
        .slider-track {
            transition: transform 0.6s ease-in-out; /* Lebih halus dan dinamis */
        }



       /* Indikator Titik (Dots) di Tengah Bawah */
        .slider-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%); /* Trik CSS agar posisinya pas di tengah-tengah */
            display: flex;
            gap: 6px;
            z-index: 5;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: background 0.3s, width 0.3s;
        }

        .dot.active {
            background: #fbbf24; /* Warna emas ala diamond MLBB */
            width: 18px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Header Sticky dengan Ikon Diperbesar tapi Ketebalan Garis Tetap -->
    <header class="navbar">
        <div class="container nav-container">
            <!-- Ikon Garis Tiga (Ukuran besar, ketebalan garis standar 2.0) -->
            <button class="icon-btn menu-btn" aria-label="Menu">
                <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="13" y2="18"></line>
                </svg>
            </button>

            <!-- Ikon Lonceng di Kanan -->
            <button class="icon-btn notif-btn" aria-label="Notifikasi">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </button>
        </div>
    </header>

                <!-- Bagian Banner KOF x MLBB (Diupdate untuk 3 Slide) -->
        <main class="container">
            <section class="banner-section">
                <div class="slider-container" id="slider">
                    <div class="slider-track" id="sliderTrack">
    <div class="slide slide-1"></div>
    <div class="slide slide-2"></div>
    <div class="slide slide-3"></div>
    <div class="slide slide-1"></div> <!-- Klon slide 1 di paling belakang -->
                    </div>

                    <!-- Indikator Titik (Dots) - Otomatis akan menyesuaikan jika CSS-nya benar -->
                    <div class="slider-dots">
                        <span class="dot active" onclick="currentSlide(0)"></span>
                        <span class="dot" onclick="currentSlide(1)"></span>
                        <span class="dot" onclick="currentSlide(2)"></span> <!-- DOT BARU -->
                    </div>
                </div>
            </section>
        </main>


    <script src="script.js"></script>
</body>
</html>
