<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tumbas Akun</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           HEADER
        ========================= */

        header {
    height: 100px;
    background: #050505;
    border-bottom: 1px solid #181818;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;
}

.flag {
    width: 80px;
    height: 52px;

    border-radius: 4px;
    overflow: hidden;

    border: 2px solid #333;
}

.flag-red {
    width: 100%;
    height: 50%;
    background: #ff0000;
}

.flag-white {
    width: 100%;
    height: 50%;
    background: #ffffff;
}

.menu {
    width: 45px;
    height: 40px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    cursor: pointer;
}

.menu span {
    width: 100%;
    height: 5px;
    background: #ffffff;
    border-radius: 1px;
}

        /* =========================
           HERO
        ========================= */

        .hero {
            text-align: center;
            padding: 120px 25px 110px;
        }

        .hero h1 {
            font-size: 52px;
            line-height: 1.2;
            margin-bottom: 35px;
        }

        .hero p {
            color: #999999;
            font-size: 25px;
            line-height: 1.7;
        }

        /* =========================
           PRODUK
        ========================= */

        .products {
            padding: 0 6% 100px;
        }

        .products-title {
            font-size: 42px;
            margin-bottom: 55px;
        }

        /* KARTU PRODUK */

        .product-card {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;

            background: #171717;

            border: 2px solid #292929;
            border-radius: 40px;

            overflow: hidden;

            cursor: pointer;
        }

        /* GAMBAR PRODUK */

        .product-image {
            width: 100%;
            height: 550px;

            background: #1a2942;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ikon controller menggunakan bentuk sederhana */

        .controller {
            position: relative;

            width: 180px;
            height: 105px;

            background: #707070;

            border-radius: 35px 35px 45px 45px;

            transform: rotate(-3deg);

            box-shadow: inset 0 -8px 0 rgba(0,0,0,0.15);
        }

        .controller::before {
            content: "";

            position: absolute;

            width: 35px;
            height: 35px;

            left: 25px;
            top: 32px;

            background: #d5d5d5;

            clip-path: polygon(
                35% 0%,
                65% 0%,
                65% 35%,
                100% 35%,
                100% 65%,
                65% 65%,
                65% 100%,
                35% 100%,
                35% 65%,
                0% 65%,
                0% 35%,
                35% 35%
            );
        }

        .button {
            position: absolute;

            width: 18px;
            height: 18px;

            border-radius: 50%;
        }

        .b1 {
            background: #ff0000;
            right: 30px;
            top: 30px;
        }

        .b2 {
            background: #00c853;
            right: 50px;
            top: 50px;
        }

        .b3 {
            background: #2196f3;
            right: 50px;
            top: 28px;
        }

        .b4 {
            background: #ffd000;
            right: 30px;
            top: 50px;
        }

        .stick {
            position: absolute;

            width: 27px;
            height: 27px;

            background: #dedede;

            border-radius: 50%;

            top: 60px;
        }

        .stick.left {
            left: 55px;
        }

        .stick.right {
            left: 105px;
        }

        /* =========================
           INFO PRODUK
        ========================= */

        .product-info {
            padding: 65px 70px 75px;
        }

        .product-name {
            font-size: 43px;
            line-height: 1.25;

            margin-bottom: 35px;
        }

        .price {
            color: #ffd000;

            font-size: 43px;
            font-weight: bold;

            margin-bottom: 35px;
        }

        .stock {
            color: #999999;

            font-size: 32px;
        }

        /* =========================
           RESPONSIVE HP
        ========================= */

        @media (max-width: 600px) {

            

            .hero {
                padding: 100px 25px 100px;
            }

            .hero h1 {
                font-size: 42px;
            }

            .hero p {
                font-size: 20px;
            }

            .products {
                padding: 0 6% 70px;
            }

            .products-title {
                font-size: 35px;
                margin-bottom: 45px;
            }

            .product-card {
                border-radius: 32px;
            }

            .product-image {
                height: 400px;
            }

            .controller {
                transform: scale(0.8);
            }

            .product-info {
                padding: 45px 60px 55px;
            }

            .product-name {
                font-size: 32px;
                margin-bottom: 28px;
            }

            .price {
                font-size: 32px;
                margin-bottom: 28px;
            }

            .stock {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="flag">
            <div class="flag-red"></div>
            <div class="flag-white"></div>
        </div>

        <div class="menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </header>


    <!-- HERO -->

    <section class="hero">

        <h1>
            Selamat Datang di<br>
            Tumbas Akun
        </h1>

        <p>
            Tempat membeli berbagai produk digital<br>
            dengan proses cepat dan mudah.
        </p>

    </section>


    <!-- PRODUK -->

    <section class="products">

        <h2 class="products-title">
            Produk Terlaris
        </h2>


        <!-- PRODUK 1 -->

        <div class="product-card">

            <div class="product-image">

                <div class="controller">

                    <div class="button b1"></div>
                    <div class="button b2"></div>
                    <div class="button b3"></div>
                    <div class="button b4"></div>

                    <div class="stick left"></div>
                    <div class="stick right"></div>

                </div>

            </div>


            <div class="product-info">

                <h3 class="product-name">
                    Advance Server LVL 3 (2 Server)
                </h3>

                <div class="price">
                    Rp12.000
                </div>

                <div class="stock">
                    Stok tersedia
                </div>

            </div>

        </div>

    </section>

</body>
                      </html>
